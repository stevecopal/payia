<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16a34a">
    <title>PAYIA - Vous êtes hors ligne</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            -webkit-font-smoothing: antialiased;
        }
        .offline-badge {
            background: rgba(34, 197, 94, 0.15);
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.6; }
            70% { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .pulse-ring { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes float-y {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .float-y { animation: float-y 4s ease-in-out infinite; }
    </style>
</head>
<body>
    <main class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md text-center">

            <!-- Icône animée -->
            <div class="relative inline-flex items-center justify-center mb-8 float-y">
                <span class="pulse-ring absolute inline-flex h-24 w-24 rounded-full bg-green-500/30"></span>
                <div class="relative w-24 h-24 rounded-full offline-badge border border-green-500/30 flex items-center justify-center">
                    <svg class="w-11 h-11 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                              d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L12 12m0 0L9.75 9.75M3 3l18 18"/>
                    </svg>
                </div>
            </div>

            <!-- Titre -->
            <h1 class="text-3xl sm:text-4xl font-bold mb-3">Vous êtes hors ligne</h1>
            <p class="text-gray-400 text-sm sm:text-base leading-relaxed mb-2">
                Pas de connexion Internet détectée.
            </p>
            

            <!-- État de reconnexion -->
            <div id="reconnect-status" class="hidden mb-6 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-gray-800 text-xs text-gray-400">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span id="reconnect-text">Reconnexion en cours…</span>
            </div>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <button type="button" id="offline-retry"
                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-500 transition-colors duration-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Réessayer
                </button>
               
            </div>

            
        </div>
    </main>

    <script>
        /* =================================================================
           Retour dans l'application après reconnexion.

           Cette page n'est jamais un état final : le bouton « Réessayer »
           et le retour de la connexion doivent ramener vers l'app.
           On ne fait donc JAMAIS window.location.reload() ici : /offline/
           est une vraie URL qui réaffiche toujours la page hors ligne,
           même quand la connexion est revenue.
           ================================================================= */
        (function () {
            'use strict';

            /* Clé de session partagée avec static/js/pwa.js */
            var LAST_PATH_KEY = 'payia:last-path';
            var AUTO_REDIRECT_KEY = 'payia:offline-autoredirect';
            var AUTO_REDIRECT_WINDOW_MS = 5000;

            var statusEl = document.getElementById('reconnect-status');
            var statusText = document.getElementById('reconnect-text');

            function showStatus(text) {
                if (statusText && text) statusText.textContent = text;
                if (statusEl) statusEl.classList.remove('hidden');
            }

            function isOfflineUrl() {
                return window.location.pathname.indexOf('/offline/') === 0;
            }

            /* Chemin interne sûr (jamais une autre origine, jamais /offline/). */
            function safePath(value) {
                if (!value) return null;
                try {
                    var url = new URL(value, window.location.origin);
                    if (url.origin !== window.location.origin) return null;
                    if (url.pathname.indexOf('/offline/') === 0) return null;
                    return url.pathname + url.search;
                } catch (e) {
                    return null;
                }
            }

            /* Page cible : celle quittée avant la coupure (mémorisée par pwa.js),
               sinon l'URL courante (page rejouée par le service worker),
               sinon la racine. */
            function resolveTarget() {
                if (!isOfflineUrl()) {
                    return window.location.pathname + window.location.search;
                }
                var saved = null;
                try { saved = sessionStorage.getItem(LAST_PATH_KEY); } catch (e) {}
                return safePath(saved) || '/';
            }

            function goToApp() {
                /* replace() : on ne laisse pas la page hors ligne dans l'historique */
                window.location.replace(resolveTarget());
            }

            /* Bouton « Réessayer » */
            function retryNow() {
                if (navigator.onLine !== false) {
                    goToApp();
                    return;
                }
                showStatus('Toujours hors ligne — vérification…');
                /* navigator.onLine est parfois pessimiste (WebView mobiles) :
                   on confirme par une requête réseau réelle. */
                fetch('/manifest.json', { method: 'GET', cache: 'no-store' })
                    .then(function (response) {
                        if (response && response.ok) {
                            goToApp();
                        } else {
                            showStatus('Toujours hors ligne — vérifiez votre connexion.');
                        }
                    })
                    .catch(function () {
                        showStatus('Toujours hors ligne — vérifiez votre connexion.');
                    });
            }

            var retryBtn = document.getElementById('offline-retry');
            if (retryBtn) retryBtn.addEventListener('click', retryNow);

            /* Connexion rétablie pendant l'affichage : retour automatique dans l'app */
            window.addEventListener('online', function () {
                showStatus('Connexion rétablie — redirection…');
                setTimeout(goToApp, 600);
            });

            /* Page chargée alors que la connexion est déjà revenue (rechargement
               manuel, retour arrière, réponse du service worker) : on repart
               dans l'app. Garde-fou : une seule redirection automatique par
               fenêtre courte, pour éviter toute boucle si le serveur reste
               injoignable alors que navigator.onLine est vrai. */
            if (navigator.onLine !== false) {
                var now = Date.now();
                var last = 0;
                try { last = parseInt(sessionStorage.getItem(AUTO_REDIRECT_KEY), 10) || 0; } catch (e) {}
                if (now - last > AUTO_REDIRECT_WINDOW_MS) {
                    try { sessionStorage.setItem(AUTO_REDIRECT_KEY, String(now)); } catch (e) {}
                    goToApp();
                }
            }
        })();
    </script>
</body>
</html>
