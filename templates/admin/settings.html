{% extends "admin/base_admin.html" %}
{% load i18n %}
{% block title %}PAYIA - Paramètres{% endblock %}
{% block dashboard_content %}
<div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold font-display">{% trans "Paramètres" %}</h1>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for setting in settings %}
        <div class="bg-white/5 backdrop-blur rounded-xl border border-gray-800 p-4">
            <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                <div class="flex-1 min-w-0">
                    <label class="block text-sm font-medium mb-1">{{ setting.key }}</label>
                    <p class="text-xs text-gray-500">{{ setting.description }}</p>
                </div>
                <input type="text" name="setting_{{ setting.key }}" value="{{ setting.value }}" class="w-full sm:w-64 px-4 py-2.5 bg-white/5 border border-gray-800 rounded-lg text-white focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none text-sm font-mono">
            </div>
        </div>
        {% endfor %}

        <div class="flex justify-end">
            <button type="submit" class="px-6 py-2.5 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-700 transition-colors">{% trans "Enregistrer" %}</button>
        </div>
    </form>
</div>
{% endblock %}
