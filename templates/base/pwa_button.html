{% comment %} Bouton "Installer l'app" — masqué par défaut,
   affiché par pwa.js quand l'app est installable et pas déjà installée. {% endcomment %}
{% load i18n %}
<button type="button" data-pwa-install
        class="hidden sm:inline-flex items-center gap-2 px-3 py-2 bg-white/[0.06] text-gray-300 text-[13px] font-semibold rounded-xl border border-white/15 hover:text-white hover:bg-white/[0.1] transition-colors duration-200">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
    </svg>
    <span class="hidden md:inline">{% trans "Installer l'app" %}</span>
</button>
