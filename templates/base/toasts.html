{% load i18n %}
<div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2 max-w-sm">
    {% if messages %}
        {% for message in messages %}
        <div class="toast-notification flex items-center p-3 rounded-lg border {% if message.tags == 'success' %}bg-gray-900 border-green-600/50{% elif message.tags == 'error' %}bg-gray-900 border-red-600/50{% elif message.tags == 'warning' %}bg-gray-900 border-yellow-600/50{% else %}bg-gray-900 border-gray-700{% endif %} transform translate-x-full opacity-0 transition-all duration-300" role="alert">
            <div class="flex-shrink-0 mr-3">
                {% if message.tags == 'success' %}
                    <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                {% elif message.tags == 'error' %}
                    <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                {% elif message.tags == 'warning' %}
                    <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
                {% else %}
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                {% endif %}
            </div>
            <p class="flex-1 text-sm text-white">{{ message }}</p>
            <button onclick="this.parentElement.remove()" class="ml-3 text-gray-500 hover:text-white">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        {% endfor %}
    {% endif %}
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.toast-notification').forEach(function(toast) {
        toast.classList.remove('translate-x-full', 'opacity-0');
        toast.classList.add('translate-x-0', 'opacity-100');
        setTimeout(function() {
            toast.classList.add('translate-x-full', 'opacity-0');
            setTimeout(function() { toast.remove(); }, 300);
        }, 4000);
    });
});
</script>
