{% load i18n %}
<header class="fixed top-0 left-0 right-0 bg-black/95 backdrop-blur-sm border-b border-gray-800 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <a href="{% url 'home' %}" class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-sm font-mono">P</span>
                </div>
                <span class="text-xl font-bold text-white font-display">PAYIA</span>
            </a>

            <div class="flex items-center space-x-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="text-sm font-medium text-gray-300 hover:text-green-400 transition-colors">{% trans "Tableau de bord" %}</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm font-medium text-gray-300 hover:text-green-400 transition-colors">{% trans "Connexion" %}</a>
                    <a href="{% url 'register' %}" class="px-4 py-2 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-500 transition-colors">{% trans "S'inscrire" %}</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
