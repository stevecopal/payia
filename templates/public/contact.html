{% extends "base/public.html" %}
{% load i18n %}
{% block title %}PAYIA - Contact{% endblock %}
{% block content %}
<section class="py-20 px-4">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center">{% trans "Contactez-nous" %}</h1>
        <p class="text-gray-600 text-center mb-12">{% trans "Une question ? Besoin d'aide ? Notre équipe est à votre disposition." %}</p>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Nom" %}</label>
                <input type="text" name="name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Email" %}</label>
                <input type="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Sujet" %}</label>
                <input type="text" name="subject" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Message" %}</label>
                <textarea name="message" rows="5" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all"></textarea>
            </div>
            <button type="submit" class="w-full px-6 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-all">
                {% trans "Envoyer" %}
            </button>
        </form>
    </div>
</section>
{% endblock %}
