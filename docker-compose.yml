# ═══════════════════════════════════════════════════════════════════════════
# PAYIA — Stack Docker de PRODUCTION
#   Django 6.1 + Gunicorn  ·  SQLite (volume Docker)  ·  Celery/Redis
#
#   ┌─────────────┐        ┌───────────────────────────┐
#   │    Caddy    │──proxy─▶ payia_web (gunicorn:8000) │
#   │ (VPS, 80/443)│        └──────────┬────────────────┘
#   └─────────────┘                   │ payia-internal
#        │ static/media (volumes)     ├─▶ payia_celery_worker
#        └────────────────────────────┴─▶ payia_celery_beat ─▶ payia_redis
#
# ─────────────────────────────────────────────────────────────────────────
# PRÉ-REQUIS (à exécuter UNE SEULE FOIS sur le VPS, AVANT `docker compose up`)
# ─────────────────────────────────────────────────────────────────────────
#   docker network create proxy-net            # déjà créé si Caddy tourne
#   docker volume create payia_sqlite_data
#   docker volume create payia_static
#   docker volume create payia_media
#   docker volume create payia_logs
#
# DÉPLOIEMENT
#   docker compose build
#   docker compose up -d
#   docker compose logs -f payia_web
# ═══════════════════════════════════════════════════════════════════════════

# ── Modèle commun aux 3 conteneurs applicatifs ────────────────────────────
x-payia-app: &payia-app
  image: payia-app:latest
  restart: unless-stopped
  env_file:
    - .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ── Variables partagées ───────────────────────────────────────────────────
# `environment` a la PRIORITÉ sur `env_file` : les réglages de production
# sont garantis même si le .env du VPS est encore en mode développement.
x-payia-env: &payia-env
  DJANGO_SETTINGS_MODULE: payia.settings
  DEBUG: "False"

  # ── SQLite : fichier stocké dans le volume payia_sqlite_data ────────────
  DB_ENGINE: django.db.backends.sqlite3
  DB_NAME: /app/data/db.sqlite3
  DB_TIMEOUT: "20"
  # Évite « database is locked » avec gunicorn + celery qui écrivent ensemble
  DB_TRANSACTION_MODE: IMMEDIATE
  DB_INIT_COMMAND: "PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;"

  # ── Celery (broker Redis interne, non exposé) ───────────────────────────
  CELERY_BROKER_URL: redis://payia_redis:6379/0
  CELERY_RESULT_BACKEND: redis://payia_redis:6379/1

  # ── Hôtes / sécurité (surchargés par .env si tu les y définis) ──────────
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-payia.cohub.site,127.0.0.1,localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://payia.cohub.site}
  # Caddy gère déjà la redirection HTTP→HTTPS : on garde Django en False
  # (sinon boucle de redirection, faute de SECURE_PROXY_SSL_HEADER).
  SECURE_SSL_REDIRECT: "False"

  TZ: UTC

services:

  # ═══════════════════════════════════════════════════════════════════════
  # Application Web — Django + Gunicorn (joignable par Caddy sur proxy-net)
  # ═══════════════════════════════════════════════════════════════════════
  payia_web:
    <<: *payia-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payia-web
    environment:
      <<: *payia-env
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    command:
      - gunicorn
      - payia.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=120
      - --graceful-timeout=30
      - --max-requests=1000
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
      - --log-level=info
    volumes:
      # Base de données SQLite
      - payia_sqlite_data:/app/data
      # Fichiers statiques → montés en :ro dans le conteneur Caddy
      - payia_static:/app/staticfiles
      # Médias uploadés → montés en :ro dans le conteneur Caddy
      - payia_media:/app/media
      # Logs applicatifs (django.log, payments.log, security.log, admin.log)
      - payia_logs:/app/logs
    networks:
      - proxy-net
      - payia-internal
    healthcheck:
      # /manifest.json est servi sans accès à la base → test fiable et léger
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/manifest.json', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
