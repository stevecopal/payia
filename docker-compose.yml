# ═══════════════════════════════════════════════════════════════════════════
# PAYIA — Stack Docker de PRODUCTION avec PostgreSQL & Celery
# ═══════════════════════════════════════════════════════════════════════════

x-payia-app: &payia-app
  image: payia-app:latest
  restart: unless-stopped
  env_file:
    - .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-payia-env: &payia-env
  DJANGO_SETTINGS_MODULE: payia.settings
  DEBUG: "False"

  # PostgreSQL
  DB_ENGINE: django.db.backends.postgresql
  DB_HOST: payia_db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-payia_db}
  DB_USER: ${DB_USER:-payia_user}
  DB_PASSWORD: ${DB_PASSWORD:-payia_secure_pass_2026}

  # Redis / Celery
  CELERY_BROKER_URL: redis://payia_redis:6379/0
  CELERY_RESULT_BACKEND: redis://payia_redis:6379/1

  # Hôtes et sécurité
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-payia.cohub.site,127.0.0.1,localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://payia.cohub.site}
  SECURE_SSL_REDIRECT: "False"

  TZ: UTC

services:

  # ── Base de données PostgreSQL dédiée à Payia ───────────────────────────
  payia_db:
    image: postgres:16-alpine
    container_name: payia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-payia_db}
      POSTGRES_USER: ${DB_USER:-payia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payia_secure_pass_2026}
    volumes:
      - payia_postgres_data:/var/lib/postgresql/data
    networks:
      - payia-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payia_user} -d ${DB_NAME:-payia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Courtier de messages Redis ──────────────────────────────────────────
  payia_redis:
    image: redis:7-alpine
    container_name: payia-redis
    restart: unless-stopped
    networks:
      - payia-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Web Django + Gunicorn ──────────────────────────────────
  payia_web:
    <<: *payia-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payia-web
    environment:
      <<: *payia-env
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    volumes:
      - payia_static:/app/staticfiles
      - payia_media:/app/media
      - payia_logs:/app/logs
    networks:
      - proxy-net
      - payia-internal
    depends_on:
      payia_db:
        condition: service_healthy
      payia_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/manifest.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Celery Worker ────────────────────────────────────────────────────────
  payia_celery_worker:
    <<: *payia-app
    container_name: payia-celery-worker
    environment:
      <<: *payia-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: celery -A payia worker --loglevel=info --concurrency=2
    volumes:
      - payia_media:/app/media
      - payia_logs:/app/logs
    networks:
      - payia-internal
    depends_on:
      payia_db:
        condition: service_healthy
      payia_redis:
        condition: service_healthy

  # ── Celery Beat ──────────────────────────────────────────────────────────
  payia_celery_beat:
    <<: *payia-app
    container_name: payia-celery-beat
    environment:
      <<: *payia-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: celery -A payia beat --loglevel=info
    volumes:
      - payia_logs:/app/logs
    networks:
      - payia-internal
    depends_on:
      payia_db:
        condition: service_healthy
      payia_redis:
        condition: service_healthy

networks:
  proxy-net:
    external: true
  payia-internal:
    driver: bridge

volumes:
  payia_postgres_data:
  payia_static:
    external: true
  payia_media:
    external: true
  payia_logs:
    external: true